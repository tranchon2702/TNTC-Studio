# minh họa:
# 1. Các nguồn phụ thuộc chính được hợp nhất thành pyproject.toml.
# 2. Môi trường hoạt động được cố định thông qua uv.lock để ngăn các máy khác nhau phân tích các kết hợp phiên bản khác nhau.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tntc-studio"
version = "1.3.6"
description = "TNTC Studio - AI Automated Short Video Production Studio for YouTube & TikTok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.2.7",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
    "gradio-client>=2.7.0",
    "yt-dlp>=2026.8.19",
    "replicate>=1.0.7",
]

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# WebUI cần thêm thư mục gốc của dự án vào sys.path trước khi nhập gói ứng dụng.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Phạm vi nhánh thống kê có thể xác định các tình huống trong đó một dòng mã được thực thi nhưng nhánh khác của điều kiện không bao giờ được xác minh.
# Nó phù hợp làm đường cơ sở chất lượng CI hơn là chỉ tính độ bao phủ của hàng. Cả CLI và WebUI đều thuộc về lối vào sản xuất,
# Do đó, cùng với lớp dịch vụ ứng dụng, cổng khởi động dịch vụ và tập lệnh Kỹ năng được xuất bản cho người dùng Đại lý,
# Bao gồm số liệu thống kê để ngăn phạm vi phủ sóng chỉ phản ánh các mô-đun cục bộ.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Phạm vi nhánh đo được cho cả bài kiểm tra đầy đủ Python 3.11 và 3.13 đều vượt quá 70,4%. Lấy 70%
# Là điểm mấu chốt ổn định, trạng thái lỗi, khôi phục bản phát hành không đồng bộ và thử nghiệm cập nhật nguyên tử Redis có thể được củng cố.
# Đồng thời để lại lề cho những khác biệt nhỏ về nhánh giữa các phiên bản Python và hệ điều hành khác nhau.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Dự án hiện tại chủ yếu ở dạng chạy ứng dụng và không được cài đặt dưới dạng gói Python có thể phát hành.
package = false
