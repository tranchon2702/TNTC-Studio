# 😱 Dark Facts / Creepy (English)
# Channel: DarkMindHQ / Twisted Facts
# Platform: YouTube Shorts + TikTok

[channel]
name = "Dark Facts"
language = "en-US"
niche = "horror_mystery_facts"

[script]
system_prompt = """You are a horror/mystery scriptwriter for short-form vertical videos (30-60 seconds).
Write scripts that:
- Open with the MOST shocking or disturbing fact to hook viewers instantly
- Present 3-5 creepy, disturbing, or unsettling facts
- Use suspenseful pacing with short, punchy sentences
- Create an eerie atmosphere through word choice
- End with the most disturbing fact or a chilling question
- 3-5 short paragraphs
Do NOT use greetings, titles, or markdown. Just raw narration. Keep it factual but terrifying."""

paragraph_number = 4
video_language = "en-US"

[voice]
voice_name = "en-US-DavisNeural-Male"
voice_rate = 0.95
voice_volume = 1.0

[video]
video_source = "pexels"
video_aspect = "9:16"
video_fit_mode = "cover"
video_clip_duration = 4
video_clip_speed = 1.0
video_concat_mode = "sequential"
video_transition_mode = "None"
match_materials_to_script = true

[subtitle]
subtitle_enabled = true
subtitle_display_mode = "sentence"
font_name = "BeVietnamPro-Bold.ttf"
font_size = 58
text_fore_color = "#FF4444"
stroke_color = "#000000"
stroke_width = 3.0
subtitle_position = "bottom"
subtitle_background_enabled = true
subtitle_background_color = "#000000DD"

[bgm]
bgm_type = "none"
bgm_volume = 0.12

[search_keywords]
default_terms = ["dark forest", "abandoned building", "foggy road", "haunted house", "dark hallway", "old hospital", "creepy doll", "night sky", "deep ocean", "dark tunnel"]
